name: zizmor

# Static analysis of our GitHub Actions workflows and composite actions
# (template injection, dangerous triggers, credential persistence, excessive
# permissions, impostor or known-vulnerable actions, ...).
# https://docs.zizmor.sh
#
# Plain `pull_request` (never `pull_request_target`): the job only reads the
# checked-out YAML, and fork PRs get a read-only token, which is all it needs.
# Findings are emitted as GitHub annotations instead of SARIF, because fork
# PRs can't upload SARIF to code scanning.

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # To bump: take the `manylinux_2_28_x86_64` wheel's sha256 from
      # https://pypi.org/pypi/zizmor/<version>/json.
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
    steps:
      - name: git checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          python3 -m venv "${RUNNER_TEMP}/zizmor"
          printf 'zizmor==%s --hash=sha256:%s\n' "${ZIZMOR_VERSION}" "${ZIZMOR_SHA256}" \
            > "${RUNNER_TEMP}/zizmor-requirements.txt"
          "${RUNNER_TEMP}/zizmor/bin/pip" install --quiet --no-deps \
            --only-binary :all: --require-hashes \
            -r "${RUNNER_TEMP}/zizmor-requirements.txt"
          "${RUNNER_TEMP}/zizmor/bin/zizmor" --version

      - name: Run zizmor
        env:
          # Enables the online audits (impostor commits, known-vulnerable
          # actions, ref confusion). Read-only token; nothing is written.
          GH_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/zizmor/bin/zizmor" --format=github .github'
