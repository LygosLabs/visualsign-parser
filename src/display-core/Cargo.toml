[package]
name = "display-core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[lib]
# cdylib for WebAssembly, rlib for the native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
bitcoin = "0.32"
hex = { workspace = true }
# Not used directly: turns on secp256k1's small precomputed tables for the
# copy `bitcoin` links (feature unification). The parser only verifies.
secp256k1 = { version = "0.29", default-features = false, features = ["lowmemory"] }
sha2 = "0.10"
visualsign-bitcoin-owned = { path = "../chain_parsers/visualsign-bitcoin-owned" }
wasm-bindgen = "=0.2.106"

[dev-dependencies]
base64 = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
